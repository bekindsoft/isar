group = 'dev.isar.isar_flutter_libs'
version = '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.3'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace = 'dev.isar.isar_flutter_libs'

    compileSdk = 34

    defaultConfig {
        minSdk = 23
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}
